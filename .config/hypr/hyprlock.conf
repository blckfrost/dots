################
### HYPRLOCK ###
################

general {
    disable_loading_message = true
    hide_cursor            = true
}

background {
    monitor  =
    path     = screenshot
    blur_size      = 4
    blur_passes    = 2
    brightness     = 0.35
    contrast       = 0.8
    vibrancy       = 0.05
}

label {
    monitor    =
    text       = $TIME
    color      = rgba(220, 220, 220, 0.85)
    font_size  = 72
    font_family = JetBrains Mono Light
    halign     = center
    valign     = center
    position   = 0, 120
}

label {
    monitor    =
    text       = cmd[update:60000] date +"%A, %d %B"
    color      = rgba(160, 160, 160, 0.7)
    font_size  = 16
    font_family = JetBrains Mono
    halign     = center
    valign     = center
    position   = 0, 52
}

input-field {
    size              = 280, 46
    halign            = center
    valign            = center
    position          = 0, -60
    outline_thickness = 1
    dots_size         = 0.25
    dots_spacing      = 0.35
    dots_center       = true
    outer_color       = rgb(40, 40, 40)
    inner_color       = rgb(18, 18, 18)
    font_color        = rgb(200, 200, 200)
    fade_on_empty     = false
    placeholder_text  = <span foreground="##666666">password</span>
    check_color       = rgb(100, 200, 140)
    fail_color        = rgb(200, 80, 80)
    fail_text         = <span foreground="##cc5555">incorrect</span>
    capslock_color    = rgb(200, 160, 60)
    rounding          = 6
}
